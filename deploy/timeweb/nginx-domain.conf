# /etc/nginx/sites-available/coffee-passport-domain — ставит activate-domain.sh.
# Сайт живёт только на https://coffeepassport.ru. http:// и www — 301 туда же
# (не GET/HEAD — 308, чтобы POST не превратился в GET). ACME webroot на 80 — для продления.
# map $coffee_passport_connection — в nginx-ip.conf / nginx-ip-redirect.conf.
# Кэш, лимиты и upstream тайлов карты (cp_tiles*) — в nginx-tiles.conf.
server {
    listen 80;
    server_name coffeepassport.ru www.coffeepassport.ru;
    location /.well-known/acme-challenge/ {
        root /var/www/coffee-passport-acme;
    }
    location / {
        if ($request_method !~ ^(GET|HEAD)$) { return 308 https://coffeepassport.ru$request_uri; }
        return 301 https://coffeepassport.ru$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name www.coffeepassport.ru;
    ssl_certificate /etc/letsencrypt/live/coffee-passport-domain/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/coffee-passport-domain/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    if ($request_method !~ ^(GET|HEAD)$) { return 308 https://coffeepassport.ru$request_uri; }
    return 301 https://coffeepassport.ru$request_uri;
}

server {
    listen 443 ssl;
    server_name coffeepassport.ru;
    ssl_certificate /etc/letsencrypt/live/coffee-passport-domain/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/coffee-passport-domain/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 25m;

    location /supabase/ {
        # Keep Studio and internal administrative services off the public proxy.
        if ($uri !~ "^/supabase/(auth/v1|rest/v1|storage/v1|realtime/v1|functions/v1|graphql/v1)(/|$)") {
            return 404;
        }
        proxy_pass http://127.0.0.1:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $coffee_passport_connection;
        proxy_read_timeout 3600s;
        proxy_buffering off;
    }

    # Тайлы карты OSM со своего домена (z 0–19), кэш на сервере — nginx-tiles.conf. Заголовки посетителя
    # дальше не идут; Cache-Control и Expires от OSM доходят до браузера как есть.
    location ~ ^/tiles/(1?\d)/(\d{1,7})/(\d{1,7})\.png$ {
        limit_req zone=cp_tiles_client burst=200 nodelay;
        limit_req_status 429;
        proxy_cache cp_tiles;
        proxy_cache_key $1/$2/$3;
        proxy_cache_lock on;
        proxy_cache_lock_timeout 30s;
        proxy_cache_revalidate on;
        proxy_cache_background_update on;
        proxy_cache_use_stale error timeout updating http_429 http_500 http_502 http_503 http_504;
        proxy_cache_valid 200 7d;
        proxy_cache_valid 404 1m;
        proxy_pass http://cp_tiles_fill/$1/$2/$3.png;
        proxy_http_version 1.1;
        proxy_pass_request_headers off;
        proxy_set_header Host tiles.local;
        proxy_read_timeout 60s;
        add_header X-Cache-Status $upstream_cache_status always;
    }

    location /tiles/ {
        return 404;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $coffee_passport_connection;
    }
}
