# /etc/nginx/sites-available/coffee-passport — ставит activate-domain.sh последним шагом,
# вместо nginx-ip.conf. Вход по IP и с чужим Host — 301 на https://coffeepassport.ru
# (не GET/HEAD — 308). IP-сертификат остаётся: без него https://IP показал бы ошибку
# сертификата до редиректа. ACME webroot на 80 — для продления IP-сертификата.
# Исключение — /supabase/ на https://IP (см. ниже).
map $http_upgrade $coffee_passport_connection {
    default upgrade;
    '' close;
}

server {
    listen 80 default_server;
    server_name 147.45.102.186 _;

    location /.well-known/acme-challenge/ {
        root /var/www/coffee-passport-acme;
    }

    location / {
        if ($request_method !~ ^(GET|HEAD)$) { return 308 https://coffeepassport.ru$request_uri; }
        return 301 https://coffeepassport.ru$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    server_name 147.45.102.186 _;
    ssl_certificate /etc/letsencrypt/live/coffee-passport-ip/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/coffee-passport-ip/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 25m;

    # Совместимость: вкладки, открытые до переезда, держат в JS https://IP/supabase.
    # Запросы с IP-страницы на IP same-origin; редирект на домен сломал бы их CORS.
    location /supabase/ {
        if ($uri !~ "^/supabase/(auth/v1|rest/v1|storage/v1|realtime/v1|functions/v1|graphql/v1)(/|$)") {
            return 404;
        }
        proxy_pass http://127.0.0.1:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $coffee_passport_connection;
        proxy_read_timeout 3600s;
        proxy_buffering off;
    }

    location / {
        if ($request_method !~ ^(GET|HEAD)$) { return 308 https://coffeepassport.ru$request_uri; }
        return 301 https://coffeepassport.ru$request_uri;
    }
}
