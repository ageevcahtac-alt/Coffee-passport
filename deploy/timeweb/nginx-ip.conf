map $http_upgrade $coffee_passport_connection {
    default upgrade;
    '' close;
}

server {
    listen 80 default_server;
    server_name 147.45.102.186;

    location /.well-known/acme-challenge/ {
        root /var/www/coffee-passport-acme;
    }

    location / {
        return 301 https://147.45.102.186$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    server_name 147.45.102.186;
    ssl_certificate /etc/letsencrypt/live/coffee-passport-ip/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/coffee-passport-ip/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 25m;

    location /supabase/ {
        # Keep Studio and internal administrative services off the public proxy.
        if ($uri !~ "^/supabase/(auth/v1|rest/v1|storage/v1|realtime/v1|functions/v1|graphql/v1)(/|$)") {
            return 404;
        }
        proxy_pass http://127.0.0.1:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $coffee_passport_connection;
        proxy_read_timeout 3600s;
        proxy_buffering off;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $coffee_passport_connection;
    }
}
