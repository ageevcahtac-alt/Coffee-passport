# /etc/nginx/sites-available/00-coffee-passport-tiles (+ ссылка в sites-enabled) — ставит install-nginx.sh.
# Уровень http: кэш и лимиты для тайлов карты. location /tiles/ — в nginx-domain.conf.
# Браузер посетителя берёт тайлы только с https://coffeepassport.ru/tiles/{z}/{x}/{y}.png (CLAUDE.md,
# «Данные только в России»); к tile.openstreetmap.org ходит сервер, только при промахе кэша.
# Политика OSM (https://operations.osmfoundation.org/policies/tiles/):
#   - свой User-Agent с контактом, Referer сайта; заголовки посетителя (cookie, IP, язык) не передаются;
#   - заголовки кэша OSM соблюдаются (Cache-Control/Expires, условные запросы при истечении);
#     proxy_cache_valid — только запасной срок, если OSM их не прислал;
#   - один запрос к OSM на тайл при одновременных промахах (proxy_cache_lock);
#   - лимиты: посетитель — 20 запросов/с (пачка 200), сервер к OSM — 10 запросов/с (пачка 40), сверх — 429.
# Размер кэша — до 2 ГБ, тайл без обращений 30 дней удаляется.

proxy_cache_path /var/cache/coffee-passport-tiles levels=1:2 keys_zone=cp_tiles:20m max_size=2g inactive=30d use_temp_path=off;

limit_req_zone $binary_remote_addr zone=cp_tiles_client:10m rate=20r/s;

# Общий лимит к OSM: один ключ на весь сервер. Действует на внутреннем сервере ниже, куда попадают
# только промахи кэша.
map $uri $cp_tiles_osm_key {
    default osm;
}
limit_req_zone $cp_tiles_osm_key zone=cp_tiles_osm:1m rate=10r/s;

# Промахи кэша из location /tiles/ (nginx-domain.conf) идут сюда.
upstream cp_tiles_fill {
    server unix:/run/nginx-coffee-passport-tiles.sock;
}

upstream cp_tiles_osm {
    server tile.openstreetmap.org:443;
    keepalive 8;
}

# Внутренний сервер (unix-сокет, снаружи недоступен): лимит к OSM и сам запрос.
server {
    listen unix:/run/nginx-coffee-passport-tiles.sock;
    access_log off;

    location ~ ^/(\d+/\d+/\d+\.png)$ {
        limit_req zone=cp_tiles_osm burst=40;
        limit_req_status 429;
        proxy_pass https://cp_tiles_osm/$1;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_ssl_name tile.openstreetmap.org;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_pass_request_headers off;
        proxy_set_header Host tile.openstreetmap.org;
        proxy_set_header Connection "";
        proxy_set_header User-Agent "CoffeePassport/1.0 (+https://coffeepassport.ru; tile proxy)";
        proxy_set_header Referer "https://coffeepassport.ru/";
        proxy_set_header Accept "image/png";
        # Условные запросы при истечении кэша (proxy_cache_revalidate) — с внешнего сервера.
        proxy_set_header If-None-Match $http_if_none_match;
        proxy_set_header If-Modified-Since $http_if_modified_since;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
    }

    location / {
        return 404;
    }
}
