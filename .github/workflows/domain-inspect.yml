name: domain-inspect
# Разбор домена coffeepassport.ru, только чтение: DNS A/AAAA снаружи и с сервера, curl -vI на
# http/https апекса, www и IP, сертификаты (openssl s_client: subject, SAN, срок), nginx (server_name,
# listen, ssl_certificate, return), адреса сайта в env приложения и Supabase, таймер продления.
# Команд, меняющих сервер, здесь быть не должно. Запуск: gh workflow run domain-inspect --ref <ветка>
on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/domain-inspect.yml
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DOMAIN: coffeepassport.ru
      IP: 147.45.102.186
    steps:
      - uses: actions/checkout@v4
      - name: dns (runner, 8.8.8.8 и 1.1.1.1)
        run: |
          for h in "$DOMAIN" "www.$DOMAIN"; do
            for t in A AAAA CNAME; do
              for r in 8.8.8.8 1.1.1.1; do echo "$h $t @$r: $(dig +short "$h" "$t" @"$r" | tr '\n' ' ')"; done
            done
          done
          echo "NS: $(dig +short NS "$DOMAIN" @8.8.8.8 | tr '\n' ' ')"
      - name: curl -vI
        run: |
          for u in "http://$DOMAIN/" "https://$DOMAIN/" "http://www.$DOMAIN/" "https://www.$DOMAIN/" "http://$IP/" "https://$IP/"; do
            echo "===== $u"
            curl -vI --max-time 20 "$u" 2>&1 | grep -vE '^\{ \[|^\} \[|^> (User-Agent|Accept)' | head -40 || true
          done
      - name: openssl s_client
        run: |
          for sni in "$DOMAIN" "www.$DOMAIN" "$IP"; do
            echo "===== connect $IP:443 servername=$sni"
            echo | timeout 20 openssl s_client -connect "$IP:443" -servername "$sni" 2>/dev/null \
              | openssl x509 -noout -subject -issuer -dates -ext subjectAltName 2>&1 || echo "no certificate"
          done
      - uses: ./.github/actions/ssh-setup
        with:
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          known_hosts: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
      - name: server (dns, nginx, certs, env-адреса)
        run: |
          set -o pipefail
          ssh prod 'bash -s' <<'SH' 2>&1 | node scripts/ops/redact.mjs
          for h in coffeepassport.ru www.coffeepassport.ru; do echo "getent $h: $(getent ahosts "$h" | awk "{print \$1}" | sort -u | tr "\n" " ")"; done
          echo "--- sites-enabled"; ls -l /etc/nginx/sites-enabled/
          echo "--- nginx -T (server_name/listen/ssl/return/include)"
          nginx -T 2>/dev/null | grep -nE '^# configuration file|server_name|listen|ssl_certificate |return |server \{' | grep -vE 'mime.types|fastcgi|snippets'
          echo "--- nginx -t"; nginx -t 2>&1
          echo "--- /etc/letsencrypt/live"; ls /etc/letsencrypt/live/ 2>&1
          for d in /etc/letsencrypt/live/*/; do [ -f "$d/cert.pem" ] && { echo "== $d"; openssl x509 -in "$d/cert.pem" -noout -subject -dates -ext subjectAltName; }; done
          echo "--- renewal confs"; ls /etc/letsencrypt/renewal/ 2>&1
          echo "--- timer"; systemctl list-timers --all --no-pager | grep -E 'cert|coffee' || true
          grep -E '^ExecStart=' /etc/systemd/system/coffee-passport-cert-renew.service || true
          systemctl show coffee-passport-cert-renew.service -p Result -p ExecMainStatus
          echo "--- env (только адреса)"
          grep -hE '^(NEXT_PUBLIC_SUPABASE_URL|NEXT_PUBLIC_SITE_URL|NEXT_PUBLIC_APP_URL|SITE_URL|APP_URL|PUBLIC_SITE_URL)=' /opt/coffee-passport/app/.env.local | sed 's/^/app: /'
          grep -hE '^(SITE_URL|API_EXTERNAL_URL|SUPABASE_PUBLIC_URL|ADDITIONAL_REDIRECT_URLS)=' /opt/coffee-passport/supabase/.env | sed 's/^/supabase: /'
          echo "--- auth runtime"; docker inspect "$(cd /opt/coffee-passport/supabase && docker compose -f docker-compose.yml -f docker-compose.local.yml ps -q auth)" --format '{{range .Config.Env}}{{println .}}{{end}}' | grep -E '^(GOTRUE_SITE_URL|GOTRUE_URI_ALLOW_LIST|API_EXTERNAL_URL|GOTRUE_JWT_ISSUER)='
          echo "--- ss :80 :443"; ss -tlnp | grep -E ':(80|443) '
          echo "--- local curl с Host"
          for h in coffeepassport.ru www.coffeepassport.ru; do curl -sI --max-time 10 -H "Host: $h" http://127.0.0.1/ | head -3; done
          SH
