name: deploy
# Выкатка прода: сначала nginx-конфиги сайта с ветки прода (deploy/timeweb/install-nginx.sh — только если
# отличаются; тайлы карты /tiles/), затем deploy/timeweb/update-app.sh на сервере, затем ждёт
# /api/health с "status":"ok" снаружи. Нет ok за 5 минут — job красный.
# Сервер всегда тянет ветку прода (fix/pre-pilot-shortlist), с какой бы ветки ни запустили workflow.
# Секреты: DEPLOY_SSH_KEY, DEPLOY_KNOWN_HOSTS. Переменная: PROD_URL.
# Локальный ssh не используется — см. CLAUDE.md, раздел «Деплой».
on:
  workflow_dispatch:
  push:
    branches: [fix/pre-pilot-shortlist]
permissions:
  contents: read
concurrency:
  group: deploy-prod
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PROD_URL: ${{ vars.PROD_URL }}
      HEALTH_EXPECT: '"status":"ok"'
      PROD_BRANCH: fix/pre-pilot-shortlist
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: superseded?
        id: fresh
        run: |
          # Сервер тянет вершину ветки прода. Если она ушла дальше этого push, выкатку сделает
          # прогон нового push (deploy-prod сериализует) — этот пропускаем, без лишнего рестарта.
          head=$(git ls-remote origin "refs/heads/$PROD_BRANCH" | cut -f1)
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "$head" != "$GITHUB_SHA" ]; then
            echo "::notice::ветка прода уже на $head, этот прогон ($GITHUB_SHA) пропущен"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: ./.github/actions/ssh-setup
        if: steps.fresh.outputs.skip != 'true'
        with:
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          known_hosts: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
      - name: nginx confs on server
        if: steps.fresh.outputs.skip != 'true'
        run: |
          set -o pipefail
          # Конфиги — с вершины ветки прода (как и код, который стянет update-app.sh), не с ветки запуска.
          git fetch -q origin "$PROD_BRANCH"
          dir=$(ssh prod 'mktemp -d /tmp/install-nginx.XXXXXX')
          git archive "origin/$PROD_BRANCH" deploy/timeweb/install-nginx.sh deploy/timeweb/nginx-tiles.conf deploy/timeweb/nginx-domain.conf \
            | ssh prod "tar -C $dir --strip-components=2 -xf -"
          ssh prod "bash $dir/install-nginx.sh $dir; rc=\$?; rm -rf $dir; exit \$rc" 2>&1 | node scripts/ops/redact.mjs
      - name: update-app.sh on server
        if: steps.fresh.outputs.skip != 'true'
        run: |
          set -o pipefail
          # Копия скрипта: update-app.sh делает git pull самого себя, а bash читает файл по ходу выполнения.
          ssh prod 'f=$(mktemp) && cp /opt/coffee-passport/app/deploy/timeweb/update-app.sh "$f" && bash "$f"; rc=$?; rm -f "$f"; exit $rc' 2>&1 | node scripts/ops/redact.mjs
      - name: deployed commit
        if: steps.fresh.outputs.skip != 'true'
        run: |
          deployed=$(ssh prod 'git -C /opt/coffee-passport/app rev-parse HEAD')
          echo "server HEAD: $deployed"
          git fetch -q origin "$PROD_BRANCH"
          # На сервере этот коммит или более новый с ветки прода (push во время выкатки).
          if ! git merge-base --is-ancestor "$GITHUB_SHA" "$deployed" 2>/dev/null && [ "$GITHUB_REF" = "refs/heads/$PROD_BRANCH" ]; then
            echo "::error::на сервере $deployed, ожидался $GITHUB_SHA или новее"; exit 1
          fi
      - name: wait for /api/health
        if: steps.fresh.outputs.skip != 'true'
        run: |
          [ -n "$PROD_URL" ] || { echo "::error::PROD_URL не задан"; exit 1; }
          end=$((SECONDS + 300)); i=0
          while [ $SECONDS -lt $end ]; do
            i=$((i + 1))
            body=$(curl -sS --max-time 15 "$PROD_URL/api/health" 2>&1 || true)
            echo "try $i: $body"
            if printf '%s' "$body" | grep -qF "$HEALTH_EXPECT"; then echo "health ok"; exit 0; fi
            sleep 10
          done
          echo "::error::/api/health без $HEALTH_EXPECT за 5 минут"; exit 1
