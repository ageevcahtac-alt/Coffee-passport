name: deploy
# Выкатка прода: то же, что deploy/timeweb/update-app.sh (его и запускает на сервере),
# затем ждёт /api/health с "status":"ok" снаружи. Нет ok за 5 минут — job красный.
# Сервер всегда тянет ветку прода (fix/pre-pilot-shortlist), с какой бы ветки ни запустили workflow.
# Секреты: DEPLOY_SSH_KEY, DEPLOY_KNOWN_HOSTS. Переменная: PROD_URL.
# Локальный ssh не используется — см. CLAUDE.md, раздел «Деплой».
on:
  workflow_dispatch:
  push:
    branches: [fix/pre-pilot-shortlist]
permissions:
  contents: read
concurrency:
  group: deploy-prod
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PROD_URL: ${{ vars.PROD_URL }}
      HEALTH_EXPECT: '"status":"ok"'
      SECRET_FILTER: 'token=|secret=|key=|password=|bearer|apikey'
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/ssh-setup
        with:
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          known_hosts: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
      - name: update-app.sh on server
        run: |
          set -o pipefail
          ssh prod 'bash /opt/coffee-passport/app/deploy/timeweb/update-app.sh' 2>&1 | grep -v -iE "$SECRET_FILTER"
      - name: deployed commit
        run: |
          deployed=$(ssh prod 'git -C /opt/coffee-passport/app rev-parse HEAD')
          echo "server HEAD: $deployed"
          if [ "$GITHUB_REF" = "refs/heads/fix/pre-pilot-shortlist" ] && [ "$deployed" != "$GITHUB_SHA" ]; then
            echo "::error::на сервере $deployed, ожидался $GITHUB_SHA"; exit 1
          fi
      - name: wait for /api/health
        run: |
          [ -n "$PROD_URL" ] || { echo "::error::PROD_URL не задан"; exit 1; }
          for i in $(seq 1 30); do
            body=$(curl -sS --max-time 30 "$PROD_URL/api/health" || true)
            echo "try $i: $body"
            if printf '%s' "$body" | grep -qF "$HEALTH_EXPECT"; then echo "health ok"; exit 0; fi
            sleep 10
          done
          echo "::error::/api/health без $HEALTH_EXPECT за 5 минут"; exit 1
