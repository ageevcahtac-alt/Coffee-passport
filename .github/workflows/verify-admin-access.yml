name: verify-admin-access
# Доступ к /admin по роли admin — на проде, через настоящую форму входа. Только вручную.
# Сервер: заявка XO Coffee по id (input xo_request_id, без привязки к дате; id, роль, статус, время, компания,
# город — без контакта, email и телефона). Заявки нет — красный. Заявки только читаются.
# Временные учётки прогона (admin-verify-*-<run>@example.com): роль admin и роль кофейни shop-xo-vsevolozhsk.
# Браузер: без входа и кофейней /admin и /api/admin закрыты; admin из /dashboard/admin по ссылке
# попадает в /admin и видит заявку XO. Учётки удаляются в конце при любом исходе.
on:
  workflow_dispatch:
    inputs:
      xo_request_id:
        description: "id заявки XO Coffee"
        required: false
        default: ab107366-51ea-4cbf-bba0-c4fb8b83872c
        type: string
  pull_request:
    paths:
      - .github/workflows/verify-admin-access.yml
      - deploy/timeweb/verify-admin-access.py
      - scripts/ops/verify-admin-access.cjs
permissions:
  contents: read
concurrency:
  group: verify-admin-access
  cancel-in-progress: false
jobs:
  syntax:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 -m py_compile deploy/timeweb/verify-admin-access.py
          node --check scripts/ops/verify-admin-access.cjs
  verify:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PROD_URL: ${{ vars.PROD_URL }}
      CAFE_ID: shop-xo-vsevolozhsk
      XO_ID: ${{ inputs.xo_request_id }}
    steps:
      - uses: actions/checkout@v4
      - name: validate
        run: '[ -n "$PROD_URL" ] || { echo "::error::PROD_URL не задан"; exit 1; }; [[ "$XO_ID" =~ ^[0-9a-f-]{36}$ ]] || { echo "::error::xo_request_id — не uuid"; exit 1; }'
      - uses: ./.github/actions/ssh-setup
        with:
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          known_hosts: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
      - name: временные учётки
        id: temp
        run: |
          umask 077
          admin_pw="Av$(openssl rand -hex 12)!a"
          cafe_pw="Cv$(openssl rand -hex 12)!a"
          echo "::add-mask::$admin_pw"
          echo "::add-mask::$cafe_pw"
          printf '{"admin":{"email":"admin-verify-admin-%s@example.com","password":"%s"},"cafe":{"email":"admin-verify-cafe-%s@example.com","password":"%s"},"cafe_id":"%s","xo_request_id":"%s"}' \
            "$GITHUB_RUN_ID" "$admin_pw" "$GITHUB_RUN_ID" "$cafe_pw" "$CAFE_ID" "$XO_ID" > "$RUNNER_TEMP/temp.json"
          remote=$(ssh prod 'mktemp /tmp/verify-admin-access.XXXXXX')
          ssh prod "cat > $remote" < deploy/timeweb/verify-admin-access.py
          echo "remote=$remote" >> "$GITHUB_OUTPUT"
          ssh prod "python3 $remote create" < "$RUNNER_TEMP/temp.json"
      - name: заявка XO по id (без персональных данных)
        id: lookup
        run: |
          set -o pipefail
          ssh prod "python3 ${{ steps.temp.outputs.remote }} lookup" < "$RUNNER_TEMP/temp.json" | tee "$RUNNER_TEMP/lookup.txt"
          grep -m1 '^XO_REQUEST_ID=' "$RUNNER_TEMP/lookup.txt" | sed 's/^XO_REQUEST_ID=/id=/' >> "$GITHUB_OUTPUT"
      - name: playwright
        run: |
          mkdir -p "$RUNNER_TEMP/pw" && cd "$RUNNER_TEMP/pw" && npm init -y > /dev/null
          npm install --silent --no-audit --no-fund playwright@1.48.2
          npx playwright install --with-deps chromium > /dev/null
      - name: доступ к /admin по роли
        env:
          XO_REQUEST_ID: ${{ steps.lookup.outputs.id }}
        run: TEMP_JSON="$RUNNER_TEMP/temp.json" node scripts/ops/verify-admin-access.cjs "$RUNNER_TEMP/pw/node_modules/playwright"
      - name: удалить временные учётки
        if: always() && steps.temp.outputs.remote != ''
        run: |
          ssh prod "python3 ${{ steps.temp.outputs.remote }} delete; rc=\$?; rm -f ${{ steps.temp.outputs.remote }}; exit \$rc" < "$RUNNER_TEMP/temp.json"
