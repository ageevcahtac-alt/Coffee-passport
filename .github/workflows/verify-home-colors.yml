name: verify-home-colors
# Цвета главной на проде по пикселям скриншота (scripts/ops/verify-home-colors.cjs):
# фон блока «Один лот. Четыре философии» против фона страницы на 390 и 1280 px,
# поля входа при настоящем автозаполнении Chrome против пустого поля на 390 px.
# PR — замер прода как есть («до», без порога). Push в ветку прода — ждёт успешный deploy
# этого коммита и проверяет с порогом («после»). Вручную — expect=match|none.
# Скриншоты и report.md — артефакт verify-home-colors, таблицы — в Summary прогона.
on:
  pull_request:
    paths:
      - .github/workflows/verify-home-colors.yml
      - scripts/ops/verify-home-colors.cjs
      - public/images/four-philosophies/**
      - components/site/FourPhilosophies.*
      - app/globals.css
  push:
    branches: [fix/pre-pilot-shortlist]
    paths:
      - .github/workflows/verify-home-colors.yml
      - scripts/ops/verify-home-colors.cjs
      - public/images/four-philosophies/**
      - components/site/FourPhilosophies.*
      - app/globals.css
  workflow_dispatch:
    inputs:
      expect:
        description: "match — красный при расхождении; none — только замер"
        default: "match"
permissions:
  contents: read
  actions: read
concurrency:
  group: verify-home-colors-${{ github.event_name }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PROD_URL: ${{ vars.PROD_URL }}
      EXPECT: ${{ github.event_name == 'push' && 'match' || github.event_name == 'workflow_dispatch' && inputs.expect || 'none' }}
    steps:
      - uses: actions/checkout@v4
      - name: validate input
        run: |
          [ -n "$PROD_URL" ] || { echo "::error::PROD_URL не задан"; exit 1; }
          case "$EXPECT" in match|none) ;; *) echo "::error::expect: match | none"; exit 1;; esac
      - name: wait for deploy of this commit (push only)
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Готовность прода = успешный deploy вершины ветки (она содержит этот коммит), и вершина
          # не сдвинулась после него. deploy сверяет HEAD сервера и ждёт /api/health ok, но прогон,
          # который обогнал более новый push, завершается успехом без выкладки (шаг superseded?) —
          # поэтому ждём прогон именно текущей вершины. Хеш картинки не годится: правка CSS его не меняет.
          for i in $(seq 1 60); do
            head=$(git ls-remote origin "refs/heads/$GITHUB_REF_NAME" | cut -f1)
            state=$(gh run list -R "$GITHUB_REPOSITORY" --workflow deploy.yml --commit "$head" \
              --json status,conclusion --jq '.[0] | "\(.status) \(.conclusion)"' || true)
            case "$state" in
              "completed success")
                if [ "$(git ls-remote origin "refs/heads/$GITHUB_REF_NAME" | cut -f1)" = "$head" ]; then
                  echo "прод на $head (содержит $GITHUB_SHA)"; exit 0
                fi;;
              completed*) echo "::error::deploy $head: $state"; exit 1;;
            esac
            sleep 20
          done
          echo "::error::за 20 минут deploy вершины ветки не завершился"
          exit 1
      - name: playwright
        run: |
          mkdir -p "$RUNNER_TEMP/pw" && cd "$RUNNER_TEMP/pw"
          npm init -y > /dev/null
          npm install --silent --no-audit --no-fund playwright@1.64.0 pngjs@7.0.0
          npx playwright install --with-deps chromium > /dev/null
      - name: measure
        env:
          OUT_DIR: ${{ runner.temp }}/home-colors
        run: |
          node scripts/ops/verify-home-colors.cjs "$RUNNER_TEMP/pw/node_modules/playwright" "$RUNNER_TEMP/pw/node_modules/pngjs"
      - name: summary
        if: always()
        run: '[ -f "$RUNNER_TEMP/home-colors/report.md" ] && cat "$RUNNER_TEMP/home-colors/report.md" >> "$GITHUB_STEP_SUMMARY" || true'
      - name: screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-home-colors-${{ github.event_name }}
          path: ${{ runner.temp }}/home-colors
          if-no-files-found: ignore
          retention-days: 14
