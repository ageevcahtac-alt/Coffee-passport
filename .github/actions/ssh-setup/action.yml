name: ssh-setup
description: Ключ деплоя и known_hosts прода из секретов. Проверка хоста включена (StrictHostKeyChecking=yes).
inputs:
  key: { description: "DEPLOY_SSH_KEY", required: true }
  known_hosts: { description: "DEPLOY_KNOWN_HOSTS", required: true }
runs:
  using: composite
  steps:
    - shell: bash
      env:
        KEY: ${{ inputs.key }}
        KNOWN_HOSTS: ${{ inputs.known_hosts }}
      run: |
        set -euo pipefail
        if [ -z "$KEY" ] || [ -z "$KNOWN_HOSTS" ]; then
          echo "::error::DEPLOY_SSH_KEY или DEPLOY_KNOWN_HOSTS не заданы"; exit 1
        fi
        install -m 700 -d ~/.ssh
        printf '%s\n' "$KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
        printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts && chmod 644 ~/.ssh/known_hosts
        cat > ~/.ssh/config <<'CFG'
        Host prod
          HostName 147.45.102.186
          User root
          IdentityFile ~/.ssh/deploy_key
          IdentitiesOnly yes
          BatchMode yes
          StrictHostKeyChecking yes
          UserKnownHostsFile ~/.ssh/known_hosts
          ConnectTimeout 20
          ServerAliveInterval 30
        CFG
        chmod 600 ~/.ssh/config
